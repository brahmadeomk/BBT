# BusductTherMo panel — X server lockdown for kiosk mode (Slice 8a).
#
# WHY: `chromium --kiosk` hides the browser's own UI, but it does nothing about
# the X server's escape hatches, and neither does a respawning systemd unit.
# With a keyboard attached to the panel:
#
#   Ctrl+Alt+F1..F6      switches to a text console, leaving the HMI behind and
#                        offering a root login prompt
#   Ctrl+Alt+Backspace   kills the X server outright
#
# Neither goes through the browser or the window manager, so the kiosk PIN gate
# never sees them. These two options close both.
#
# THIS IS NOT A SUBSTITUTE FOR REMOVING THE KEYBOARD. A panel with no keyboard
# attached has neither of these routes and cannot be typed into at all; that
# remains the strongest option and costs nothing. This file is for panels where
# a keyboard has to stay connected.
#
# Xorg only. On a Wayland session (labwc/wayfire, the Bookworm default on some
# images) there is no equivalent file and no VT-switch binding by default —
# check with `loginctl show-session $XDG_SESSION_ID -p Type` before assuming
# this file is doing anything.
#
# Install: see docs/pi-deployment.md §12f.
#   sudo install -d /etc/X11/xorg.conf.d
#   sudo cp deploy/xorg.conf.d/10-busduct-kiosk.conf /etc/X11/xorg.conf.d/
#   # takes effect on the next X restart (reboot is the honest test)
#
# RECOVERY, and read this before installing. With DontVTSwitch on and the kiosk
# respawning, a panel whose HMI is broken is genuinely awkward to get into from
# the front. Keep a way in that does not depend on the display:
#   - SSH (the normal route; confirm it works BEFORE you install this), or
#   - `sudo systemctl stop busduct-kiosk` over SSH to drop to the desktop, or
#   - boot with the file renamed if X itself will not start.

Section "ServerFlags"
    Option "DontVTSwitch"      "true"
    Option "DontZap"           "true"
EndSection
